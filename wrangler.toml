# Ledgerline — Cloudflare Workers configuration
#
# This file is complete and committed on purpose: it documents every binding the
# service needs. The only value you must change before deploying is the D1
# `database_id` (see DEPLOYMENT in the README).

name = "ledgerline"
main = "src/index.ts"
compatibility_date = "2025-04-01"

# ---------------------------------------------------------------------------
# Durable Objects — the authoritative, strongly-consistent coordination layer.
#   StreamDO       : one instance per stream (ordering, idempotency, hash chain)
#   RateLimiterDO  : one instance per API key (token-bucket rate limiting)
# ---------------------------------------------------------------------------
[[durable_objects.bindings]]
name = "STREAM"
class_name = "StreamDO"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiterDO"

# New Durable Object classes are created with the SQLite-backed storage engine,
# which is the current default and is available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["StreamDO", "RateLimiterDO"]

# ---------------------------------------------------------------------------
# D1 — the eventually-consistent SQL read model (CQRS query side).
# Replace `database_id` with the id printed by `wrangler d1 create ledgerline`.
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "ledgerline"
database_id = "f650cfc5-1b00-4199-9257-c8cc51ac484f"
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# Secrets (do NOT commit real values):
#   ADMIN_SECRET — guards POST /v1/keys. Set with:
#       wrangler secret put ADMIN_SECRET
# In local dev, put it in `.dev.vars` (git-ignored). In tests it is injected by
# vitest.config.ts.
# ---------------------------------------------------------------------------
[observability]
enabled = true
