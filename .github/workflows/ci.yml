name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          # miniflare 4 / wrangler 4 require Node >= 22.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npx vitest run --reporter=default --reporter=json --outputFile.json=vitest.json

      # The landing page and README quote the test count; fail if it drifts.
      - name: Check quoted test count
        run: node -e "const n=require('./vitest.json').numTotalTests;const fs=require('fs');for(const f of ['src/worker/landing.ts','README.md'])if(!fs.readFileSync(f,'utf8').includes(n+' tests'))throw new Error(f+' does not say '+n+' tests')"
