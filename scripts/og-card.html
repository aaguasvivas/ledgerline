<!doctype html>
<!--
  Source for src/worker/og.png, the 1200x630 social preview card served at
  /og.png. Re-render with any headless browser at a 1200x630 viewport, e.g.
  Playwright: page.setViewportSize({ width: 1200, height: 630 });
  page.screenshot({ path: 'src/worker/og.png' }).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;1,8..60,600&display=block">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #0B0E13; color: #E8EDF3; font-family: Inter, sans-serif; position: relative; padding: 64px 72px; display: flex; flex-direction: column; }
  body::before { content: ""; position: absolute; inset: -260px -180px auto 520px; height: 700px; background: radial-gradient(closest-side, rgba(227, 179, 65, 0.13), transparent); }
  .brand { position: relative; display: flex; align-items: center; gap: 14px; font: 600 28px/1 Inter, sans-serif; letter-spacing: -0.01em; }
  .brand svg { width: 44px; height: 22px; fill: none; stroke: #E3B341; stroke-width: 1.6; }
  .brand .tip { fill: #E3B341; }
  h1 { position: relative; margin-top: 46px; font: 600 70px/1.05 "Source Serif 4", Georgia, serif; letter-spacing: -0.025em; max-width: 900px; }
  h1 em { color: #E3B341; }
  .chain { position: relative; margin-top: auto; display: flex; align-items: center; gap: 14px; font-family: "JetBrains Mono", monospace; }
  .block { background: #121821; border: 1px solid #243041; border-top: 3px solid #3FBF73; border-radius: 12px; padding: 14px 18px; min-width: 214px; }
  .block b { color: #E3B341; font-size: 20px; }
  .block span { display: block; margin-top: 6px; color: #9AA5B4; font-size: 16px; }
  .arrow { color: #E3B341; font-size: 24px; }
  .verify { margin-left: 18px; padding: 16px 20px; border-radius: 12px; background: rgba(63, 191, 115, 0.12); border: 1px solid rgba(63, 191, 115, 0.45); color: #3FBF73; font: 600 19px/1.3 "JetBrains Mono", monospace; }
  .meta { position: relative; margin-top: 28px; display: flex; justify-content: space-between; color: #6B7684; font: 400 17px/1 "JetBrains Mono", monospace; letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="brand"><svg viewBox="0 0 28 14"><rect x="1" y="2" width="7" height="10" rx="2"/><rect x="10.5" y="2" width="7" height="10" rx="2"/><rect class="tip" x="20" y="2" width="7" height="10" rx="2"/></svg>Ledgerline</div>
  <h1>An append-only log that can <em>prove</em> its own history.</h1>
  <div class="chain">
    <div class="block"><b>#1</b><span>5a02b02016ac…</span></div>
    <div class="arrow">→</div>
    <div class="block"><b>#2</b><span>a9ad4bb8a510…</span></div>
    <div class="arrow">→</div>
    <div class="block"><b>#3</b><span>8f0f4f553936…</span></div>
    <div class="verify">verify → valid: true</div>
  </div>
  <div class="meta"><span>Exactly-once · gap-free ordering · SHA-256 hash chain</span><span>Cloudflare Workers + Durable Objects</span></div>
</body>
</html>
